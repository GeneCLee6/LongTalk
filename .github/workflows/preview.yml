name: Preview

# Every pull request from this repository gets its own Worker, longtalk-pr-<number>, with its own
# Durable Object storage (never production's rooms). The link is left as a comment on the pull
# request, and the Worker is deleted when the pull request closes (DEPLOY.md §2).
#
# Why a Worker per pull request and not `wrangler versions upload`: a version of the production
# Worker shares its Durable Object namespace, so a preview would run on production's data, and
# Cloudflare gives no preview URLs to Workers that implement a Durable Object.
#
# Skipped (with a notice, never a failure) when the secrets are not set, and for pull requests from
# forks and Dependabot, which GitHub gives no secrets.
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, closed]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  # A newer push replaces a running deploy; the clean-up after closing waits for it instead
  cancel-in-progress: ${{ github.event.action != 'closed' }}

permissions:
  contents: read
  pull-requests: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WORKER: longtalk-pr-${{ github.event.pull_request.number }}
  PR: ${{ github.event.pull_request.number }}

jobs:
  deploy:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      url: ${{ steps.deploy.outputs.url }}
      sfu: ${{ steps.sfu.outputs.ready }}
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      FROM_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
    steps:
      - name: Check for Cloudflare credentials
        id: creds
        run: |
          if [ "$FROM_FORK" = "true" ]; then
            echo "::notice::Pull request from a fork: no preview (forks never get the deploy secrets)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare secrets are not set; skipping the preview (see DEPLOY.md §1)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.creds.outputs.ready == 'true'
        with:
          ref: ${{ env.HEAD_SHA }}

      - uses: actions/setup-node@v7
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version: '22'
          cache: npm

      - name: Build and deploy the preview Worker
        if: steps.creds.outputs.ready == 'true'
        id: deploy
        run: |
          npm ci
          CLOUDFLARE_ENV=preview APP_VERSION="$HEAD_SHA" npm run build
          # Every preview shares the longtalk-preview D1 database (I2, DEPLOY.md §4): its tables
          # first. Migrations only ever add, so previews of older branches keep working
          npx wrangler d1 migrations apply longtalk-preview --env preview --remote
          npx wrangler deploy --name "$WORKER" --var "APP_VERSION:$HEAD_SHA" --message "PR #$PR $HEAD_SHA" | tee deploy.log
          echo "url=$(grep -o 'https://[^ ]*workers.dev' deploy.log | head -1)" >> "$GITHUB_OUTPUT"

      - name: Give the preview the Realtime SFU app (optional)
        if: steps.creds.outputs.ready == 'true'
        id: sfu
        env:
          REALTIME_APP_ID: ${{ secrets.REALTIME_APP_ID }}
          REALTIME_APP_SECRET: ${{ secrets.REALTIME_APP_SECRET }}
        run: |
          if [ -z "$REALTIME_APP_ID" ] || [ -z "$REALTIME_APP_SECRET" ]; then
            echo "::notice::REALTIME_APP_ID / REALTIME_APP_SECRET are not set; /api/sfu answers 503 on this preview (DEPLOY.md §5)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$REALTIME_APP_ID" | npx wrangler secret put REALTIME_APP_ID --name "$WORKER"
          printf '%s' "$REALTIME_APP_SECRET" | npx wrangler secret put REALTIME_APP_SECRET --name "$WORKER"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Give the preview the Realtime TURN key (optional)
        if: steps.creds.outputs.ready == 'true'
        env:
          REALTIME_TURN_KEY_ID: ${{ secrets.REALTIME_TURN_KEY_ID }}
          REALTIME_TURN_KEY_API_TOKEN: ${{ secrets.REALTIME_TURN_KEY_API_TOKEN }}
        run: |
          if [ -z "$REALTIME_TURN_KEY_ID" ] || [ -z "$REALTIME_TURN_KEY_API_TOKEN" ]; then
            echo "::notice::REALTIME_TURN_KEY_ID / REALTIME_TURN_KEY_API_TOKEN are not set; /api/turn answers STUN only on this preview (DEPLOY.md §5)"
            exit 0
          fi
          printf '%s' "$REALTIME_TURN_KEY_ID" | npx wrangler secret put REALTIME_TURN_KEY_ID --name "$WORKER"
          printf '%s' "$REALTIME_TURN_KEY_API_TOKEN" | npx wrangler secret put REALTIME_TURN_KEY_API_TOKEN --name "$WORKER"

      - name: Give the preview the /admin password (optional)
        if: steps.creds.outputs.ready == 'true'
        env:
          ADMIN_TOKEN: ${{ secrets.PREVIEW_ADMIN_TOKEN }}
        run: |
          if [ -z "$ADMIN_TOKEN" ]; then
            echo "::notice::PREVIEW_ADMIN_TOKEN is not set; /admin stays closed (503) on this preview (DEPLOY.md §8)"
            exit 0
          fi
          printf '%s' "$ADMIN_TOKEN" | npx wrangler secret put ADMIN_TOKEN --name "$WORKER"

      - name: Smoke test
        if: steps.creds.outputs.ready == 'true'
        env:
          SITE_URL: ${{ steps.deploy.outputs.url }}
        run: ./scripts/smoke.sh "$SITE_URL" "$HEAD_SHA"

      - name: Comment the link on the pull request
        if: steps.creds.outputs.ready == 'true' && steps.deploy.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SITE_URL: ${{ steps.deploy.outputs.url }}
        run: |
          marker='<!-- longtalk-preview -->'
          {
            echo "$marker"
            echo "**預覽部署**：$SITE_URL"
            echo
            echo "- commit：\`$HEAD_SHA\`"
            echo "- 獨立的 Worker（\`$WORKER\`）與房間資料，不會動到正式站；PR 關閉時自動刪除"
          } > comment.md
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@comment.md > /dev/null
          else
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file comment.md
          fi

  # e2-t10 (AC-2.2): two Chromium browsers with fake camera and microphone meet in a room on this
  # preview, through the real Realtime SFU (e2e/interop.spec.ts). Skipped, with a notice, when there
  # is no preview (forks, no Cloudflare secrets) or the preview has no SFU app. On failure the
  # traces, screenshots and videos are uploaded as the `e2e` artifact (DEPLOY.md §7).
  e2e:
    needs: deploy
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_URL: ${{ needs.deploy.outputs.url }}
      SFU: ${{ needs.deploy.outputs.sfu }}
      # The test only drives browsers: keep the deploy credentials out of this job
      CLOUDFLARE_API_TOKEN: ''
      CLOUDFLARE_ACCOUNT_ID: ''
    steps:
      - name: Is there a preview with the SFU?
        id: check
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "::notice::No preview was deployed; skipping the interop test"
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ "$SFU" != "true" ]; then
            echo "::notice::The preview has no Realtime SFU app; skipping the interop test (DEPLOY.md §5)"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.check.outputs.run == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v7
        if: steps.check.outputs.run == 'true'
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies and Chromium
        if: steps.check.outputs.run == 'true'
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Interop test against the preview
        if: steps.check.outputs.run == 'true'
        run: npm run test:e2e -- --project=chromium

      - uses: actions/upload-artifact@v4
        if: failure() && steps.check.outputs.run == 'true'
        with:
          name: e2e
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  # H6 (e2-t16, AC-2.8): a Firefox and a Chromium in one room on this preview, through the real
  # SFU (e2e/crossbrowser.spec.ts): media both ways, a mute, a share each way; then the same with
  # Playwright's WebKit where its build has WebRTC and capture devices. A job of its own beside
  # `e2e`, so it neither slows nor holds up the Chromium interop test; skipped like it when there
  # is no preview with the SFU. Not a required check (DEPLOY.md §7).
  e2e-firefox:
    needs: deploy
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_URL: ${{ needs.deploy.outputs.url }}
      SFU: ${{ needs.deploy.outputs.sfu }}
      CLOUDFLARE_API_TOKEN: ''
      CLOUDFLARE_ACCOUNT_ID: ''
    steps:
      - name: Is there a preview with the SFU?
        id: check
        run: |
          if [ -z "$BASE_URL" ] || [ "$SFU" != "true" ]; then
            echo "::notice::No preview with the Realtime SFU; skipping the cross-browser interop test"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.check.outputs.run == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v7
        if: steps.check.outputs.run == 'true'
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies, Firefox, Chromium and WebKit
        if: steps.check.outputs.run == 'true'
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox webkit

      - name: Firefox (then WebKit) with Chromium against the preview
        if: steps.check.outputs.run == 'true'
        run: npm run test:e2e -- --project=firefox

      - uses: actions/upload-artifact@v4
        if: always() && steps.check.outputs.run == 'true'
        with:
          name: e2e-firefox
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # e11-t05 (AC-11.5): hammers this preview's room creation and WebSockets within reason
  # (scripts/abuse.ts, about a minute) and checks each limit answers: Turnstile (the preview's test
  # keys), the creation limit, a frame flood, an oversized frame, the connection rate, the security
  # headers, and with PREVIEW_ADMIN_TOKEN the blocklist. After the browser tests (both e2e jobs), so the limits it
  # spends for the runner's network never get in their way. Skipped when there is no preview.
  abuse:
    needs: [deploy, e2e, e2e-firefox]
    if: always() && github.event.action != 'closed' && needs.deploy.outputs.url != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: ${{ needs.deploy.outputs.url }}
      ADMIN_TOKEN: ${{ secrets.PREVIEW_ADMIN_TOKEN }}
      CLOUDFLARE_API_TOKEN: ''
      CLOUDFLARE_ACCOUNT_ID: ''
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Abuse test against the preview
        run: node --experimental-strip-types --disable-warning=ExperimentalWarning scripts/abuse.ts | tee -a "$GITHUB_STEP_SUMMARY"

  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete the preview Worker and its data
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare secrets are not set; nothing to delete"
            exit 0
          fi
          # Only ever a PR Worker: the name is built from the pull request number above
          case "$WORKER" in longtalk-pr-[0-9]*) ;; *) echo "::error::Refusing to delete $WORKER"; exit 1 ;; esac
          # Outside the repository, so wrangler reads no config and deletes exactly this name
          cd "$RUNNER_TEMP"
          if npx --yes wrangler@4 delete --name "$WORKER" --force; then
            echo "Deleted $WORKER"
          else
            echo "::notice::$WORKER could not be deleted (it may never have been deployed)"
          fi
