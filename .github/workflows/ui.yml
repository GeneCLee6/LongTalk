name: UI checks

# G5 (e4-t14, e4-t17; DEPLOY.md §7): accessibility and visual regression against the built app
# served by `vite preview` (the Worker and its Durable Objects run in workerd; no Cloudflare
# account, no Realtime SFU). Both jobs run in the Playwright Docker image, so the fonts and the
# rendering are the same on every run and match the committed visual baselines.
#
#   a11y    axe-core on every screen and open state, keyboard paths (e2e/local/a11y.spec.ts), and
#           Lighthouse's accessibility score ≥ 0.95 on home, pre-join and room, desktop and phone
#           (scripts/lighthouse.ts; the scores are in the run's summary); also the RNNoise worklet
#           loading lazily and running in Chromium (e2e/local/noise.spec.ts, H4)
#   visual  screenshots of home, pre-join, room × light / dark × desktop / phone against
#           e2e/local/__screenshots__. When they differ (or are missing) the job fails and uploads
#           `visual-baselines`: the new screenshots, laid out to be copied over the old ones once
#           the change is meant (DEPLOY.md §7). Run it by hand with `update` to get them anyway.
#
# Not required checks for merging into main (only CI's `verify` is): see DEPLOY.md §7.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      update:
        description: Write new visual baselines and upload them (the job does not fail)
        type: boolean
        default: false

concurrency:
  group: ui-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      # Keep the tag equal to the @playwright/test version in package.json
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: axe and keyboard checks, advanced noise suppression in Chromium
        run: npx playwright test -c playwright.local.config.ts a11y.spec.ts noise.spec.ts

      - name: Lighthouse accessibility ≥ 0.95
        env:
          BASE_URL: http://127.0.0.1:4173
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 --strictPort > preview.log 2>&1 &
          node -e "
            (async () => {
              let last
              for (let i = 0; i < 60; i++) {
                try { if ((await fetch(process.env.BASE_URL + '/api/health')).ok) return }
                catch (error) { last = error }
                await new Promise((resolve) => setTimeout(resolve, 1000))
              }
              console.error('vite preview did not answer:', last)
              process.exit(1)
            })()"
          npm run lighthouse

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a11y
          path: |
            lighthouse-report/
            test-results/
            playwright-report/
            preview.log
          retention-days: 7
          if-no-files-found: ignore

  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      UPDATE: ${{ github.event_name == 'workflow_dispatch' && inputs.update }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Compare with the baselines
        id: compare
        if: env.UPDATE != 'true'
        run: npx playwright test -c playwright.local.config.ts visual.spec.ts

      - name: Write new baselines
        if: always() && (env.UPDATE == 'true' || steps.compare.outcome == 'failure')
        run: npx playwright test -c playwright.local.config.ts visual.spec.ts --update-snapshots --output test-results-update

      - uses: actions/upload-artifact@v4
        if: always() && (env.UPDATE == 'true' || steps.compare.outcome == 'failure')
        with:
          # Unzip into e2e/local/__screenshots__ (DEPLOY.md §7)
          name: visual-baselines
          path: e2e/local/__screenshots__/
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: failure() && steps.compare.outcome == 'failure'
        with:
          # Expected, actual and diff images of every screenshot that changed
          name: visual-diff
          path: |
            test-results/
            playwright-report/
          retention-days: 7
