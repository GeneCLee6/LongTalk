[package]
name = "longtalk-agent"
version = "0.1.0"
description = "LongTalk desktop agent: joins a room with a pairing code and shares this computer's screen (E9)"
authors = ["LongTalk"]
license = "UNLICENSED"
edition = "2021"
rust-version = "1.80"
publish = false

[lib]
# The `_lib` suffix keeps the library apart from the binary of the same name (Windows, cargo#8519)
name = "longtalk_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "macros"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
gethostname = "1"
sys-locale = "0.3"
tauri-plugin-notification = "2"

# Injecting input, the Escape hook, the lock and secure-desktop checks (N4, src/inject, src/escape.rs)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_RemoteDesktop",
  "Win32_System_StationsAndDesktops",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.25", features = ["highsierra"] }
core-foundation = "0.10"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[features]
# Automatic updates (f-remote-control-security.md §5.9): off until the owner has generated the
# updater key and put its public half in tauri.conf.json (agent/README.md). The release workflow
# turns it on when the TAURI_SIGNING_PRIVATE_KEY secret exists.
updater = ["dep:tauri-plugin-updater"]
